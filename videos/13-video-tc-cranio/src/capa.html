<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Capa · Como ler uma TC de crânio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700..800&family=Onest:wght@600..800&display=block" rel="stylesheet">
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
               "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }
</script>
<style>
  /* Capa do vídeo (1080 × 1920). O texto fica entre y 260 e 1660, a área que a grade do perfil do TikTok mostra (3:4 no centro). */
  :root { --tinta: #0C1A21; --lima: #C1FF72; --alerta: #FF4D57; --titulo: 'Bricolage Grotesque', sans-serif; --texto: 'Onest', sans-serif; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; }
  #capa { position: relative; width: 1080px; height: 1920px; overflow: hidden; color: #fff;
          background:
            radial-gradient(70% 45% at 50% 58%, rgba(193,255,114,.16), transparent 70%),
            repeating-linear-gradient(0deg, rgba(193,255,114,.05) 0 1px, transparent 1px 54px),
            repeating-linear-gradient(90deg, rgba(193,255,114,.05) 0 1px, transparent 1px 54px),
            radial-gradient(120% 90% at 50% 40%, #15323C, #081217); }
  #capa::after { content: ''; position: absolute; inset: 0; background: radial-gradient(75% 60% at 50% 50%, transparent 55%, rgba(0,0,0,.6)); pointer-events: none; }
  #bot { position: absolute; left: 0; top: 0; }
  .linha { position: absolute; left: 0; right: 0; text-align: center; font: 800 124px/0.95 var(--titulo); letter-spacing: -.05em; }
  #l1 { top: 250px; }
  #l2 { top: 385px; font-size: 132px; }
  #l2 span { display: inline-block; background: var(--lima); color: var(--tinta); padding: 4px 34px 22px; border-radius: 34px; transform: rotate(-3deg);
             box-shadow: 0 24px 60px rgba(0,0,0,.45), 0 0 0 10px rgba(193,255,114,.18); }
  #chip { position: absolute; left: 50%; top: 610px; transform: translateX(-50%); display: flex; align-items: center; gap: 16px; white-space: nowrap;
          border: 4px solid var(--lima); color: var(--lima); background: rgba(8,18,23,.75); border-radius: 999px; padding: 16px 32px;
          font: 800 50px/1 var(--titulo); letter-spacing: -.02em; }
  #chip b { color: #fff; }
  #foto { position: absolute; left: 250px; top: 740px; width: 580px; height: 640px; border-radius: 40px; overflow: hidden; transform: rotate(3deg); background: #000;
          box-shadow: 0 30px 80px rgba(0,0,0,.55), 0 0 0 6px rgba(193,255,114,.35); }
  #foto img, #foto svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  #foto img { object-fit: cover; }
  .neon { filter: drop-shadow(0 0 8px rgba(193,255,114,.95)) drop-shadow(0 0 26px rgba(193,255,114,.6)); }
  #rotulo { position: absolute; left: 110px; top: 1330px; transform: rotate(-6deg); background: var(--alerta); color: #fff; border-radius: 24px; padding: 14px 26px;
            font: 800 58px/1 var(--titulo); letter-spacing: -.03em; box-shadow: 0 20px 50px rgba(0,0,0,.5), 0 0 0 8px rgba(255,77,87,.25); }
  #marca { position: absolute; left: 50%; top: 150px; transform: translateX(-50%); font: 800 48px var(--titulo); color: var(--lima); }
</style>
</head>
<body>
<div id="capa">
  <div id="foto"><img src="../assets/fotos/prep/epidural.jpg" alt=""><svg id="lente" viewBox="0 0 878 1000" preserveAspectRatio="xMidYMid slice"></svg></div>
  <div id="rotulo">o que é isso?</div>
  <canvas id="bot" width="1080" height="1920"></canvas>
  <div class="linha" id="l1">Você sabe ler</div>
  <div class="linha" id="l2"><span>TC de crânio?</span></div>
  <div id="chip"><b>5 passos:</b> Blood Can Be Very Bad</div>
  <div id="marca">@omedbot</div>
</div>
<script type="module">
  import { criarPalco, carregarMedbot } from '../../_personagem/web/medbot-3d.js';
  // contorno da lente (os mesmos pontos do vídeo, na imagem preparada de 878 × 1000)
  const L = [[0.31, 0.15], [0.22, 0.2], [0.15, 0.3], [0.115, 0.42], [0.11, 0.55], [0.13, 0.68], [0.17, 0.78], [0.22, 0.85],
    [0.28, 0.8], [0.33, 0.7], [0.37, 0.57], [0.38, 0.44], [0.37, 0.31], [0.34, 0.21]].map(([x, y]) => [x * 878, y * 1000]);
  const n = L.length, f = (p) => `${p[0].toFixed(1)} ${p[1].toFixed(1)}`;
  let d = `M${f(L[0])}`;
  for (let i = 0; i < n; i++) {
    const p0 = L[(i - 1 + n) % n], p1 = L[i], p2 = L[(i + 1) % n], p3 = L[(i + 2) % n];
    d += ` C${f([p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6])} ${f([p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6])} ${f(p2)}`;
  }
  document.getElementById('lente').innerHTML = `<path d="${d} Z" fill="#C1FF72" opacity=".16"/><path d="${d} Z" fill="none" stroke="#C1FF72" stroke-width="9" class="neon"/>`;
  const palco = criarPalco(document.getElementById('bot'));
  const bot = await carregarMedbot(palco, '../../_personagem/web/medbot.glb');
  await document.fonts.ready;
  await Promise.all([...document.images].map((im) => (im.complete ? null : new Promise((r) => { im.onload = im.onerror = r; }))));
  bot.pose({ x: 850, y: 1530, tamanho: 420, yaw: -0.3, roll: -0.1, estica: 1.04, olhar: [-26, 22], olho: [1.1, 0.95, 0], pisca: 1, boca: 0.75, pendulo: [0.15, -0.25] });
  palco.render();
  window.pronto = true;
</script>
</body>
</html>
